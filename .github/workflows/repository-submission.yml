name: Repository Submission

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  process:
    runs-on: ubuntu-latest
    if: github.repository == 'wabbajack-tools/mod-lists'
    env:
      APP_CONFIGURED: ${{ secrets.SUBMISSION_APP_ID != '' && secrets.SUBMISSION_APP_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - id: app-token
        if: env.APP_CONFIGURED == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.SUBMISSION_APP_ID }}
          private-key: ${{ secrets.SUBMISSION_APP_PRIVATE_KEY }}
      - uses: actions/github-script@v7
        env:
          USING_APP_TOKEN: ${{ steps.app-token.outputs.token != '' }}
        with:
          github-token: ${{ steps.app-token.outputs.token || github.token }}
          script: |
            const fs = require('fs');
            const issue = context.payload.issue;
            const body = issue.body || '';

            if (issue.pull_request) return;
            if (issue.state !== 'open') return;
            const isSubmission = issue.labels.some(l => l.name === 'repository-submission')
              || body.includes('### Link to your modlists.json');
            if (!isSubmission) return;

            if (context.eventName === 'issue_comment') {
              const c = context.payload.comment;
              if (c.user.type === 'Bot') return;
              if (!/\b(fixed|recheck|revalidate|retry)\b/i.test(c.body || '')) return;
              try {
                await github.rest.reactions.createForIssueComment({ ...context.repo, comment_id: c.id, content: 'rocket' });
              } catch {}
            }

            const MARKER = '<!-- repository-submission-bot -->';
            async function report(text) {
              const comments = await github.paginate(github.rest.issues.listComments,
                { ...context.repo, issue_number: issue.number, per_page: 100 });
              const mine = comments.find(c => c.body.includes(MARKER));
              const full = `${MARKER}\n${text}`;
              if (mine) {
                await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body: full });
              } else {
                await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body: full });
              }
            }

            function field(name) {
              const re = new RegExp('### ' + name + '\\s*\\r?\\n\\s*\\r?\\n(.+)');
              const m = body.match(re);
              const v = m ? m[1].trim() : '';
              return v === '_No response_' ? '' : v;
            }

            const problems = [];
            const warnings = [];
            const clean = s => s.replace(/`/g, '');

            let gameNames = null;
            try {
              const gresp = await fetch('https://raw.githubusercontent.com/wabbajack-tools/wabbajack/main/Wabbajack.DTOs/Game/Game.cs');
              if (gresp.ok) {
                const src = await gresp.text();
                const names = [...src.matchAll(/^\s*([A-Z][A-Za-z0-9]+)\s*,?\s*$/gm)].map(m => m[1].toLowerCase());
                if (names.length >= 10) gameNames = new Set(names);
              }
            } catch {}
            let allowedTags = new Set();
            try {
              allowedTags = new Set(JSON.parse(fs.readFileSync('allowed_tags.json', 'utf8')).map(t => String(t).toLowerCase()));
            } catch {}

            function imageDims(buf) {
              if (buf.length >= 24 && buf[0] === 0x89 && buf[1] === 0x50 && buf[2] === 0x4E && buf[3] === 0x47) {
                return { fmt: 'png', w: buf.readUInt32BE(16), h: buf.readUInt32BE(20) };
              }
              if (buf.length >= 4 && buf[0] === 0xFF && buf[1] === 0xD8) {
                let off = 2;
                while (off + 9 < buf.length) {
                  if (buf[off] !== 0xFF) { off++; continue; }
                  const marker = buf[off + 1];
                  if (marker >= 0xC0 && marker <= 0xCF && marker !== 0xC4 && marker !== 0xC8 && marker !== 0xCC) {
                    return { fmt: 'jpg', h: buf.readUInt16BE(off + 5), w: buf.readUInt16BE(off + 7) };
                  }
                  off += 2 + buf.readUInt16BE(off + 2);
                }
                return { fmt: 'jpg', w: 0, h: 0 };
              }
              if (buf.length >= 30 && buf.toString('ascii', 0, 4) === 'RIFF' && buf.toString('ascii', 8, 12) === 'WEBP') {
                const chunk = buf.toString('ascii', 12, 16);
                if (chunk === 'VP8X') return { fmt: 'webp', w: 1 + buf.readUIntLE(24, 3), h: 1 + buf.readUIntLE(27, 3) };
                if (chunk === 'VP8 ') return { fmt: 'webp', w: buf.readUInt16LE(26) & 0x3FFF, h: buf.readUInt16LE(28) & 0x3FFF };
                if (chunk === 'VP8L') {
                  const b = buf.readUInt32LE(21);
                  return { fmt: 'webp', w: 1 + (b & 0x3FFF), h: 1 + ((b >> 14) & 0x3FFF) };
                }
                return { fmt: 'webp', w: 0, h: 0 };
              }
              return null;
            }

            async function fetchImage(u) {
              const controller = new AbortController();
              let resp;
              try { resp = await fetch(u, { signal: controller.signal }); }
              catch (e) { return { err: e.message }; }
              if (!resp.ok) return { err: `HTTP ${resp.status}` };
              const reader = resp.body.getReader();
              const chunks = [];
              let total = 0;
              while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                total += value.length;
                if (total > 3 * 1024 * 1024) { controller.abort(); return { tooLarge: true, size: total }; }
                chunks.push(Buffer.from(value));
              }
              return { buf: Buffer.concat(chunks), size: total };
            }

            const repoName = field('Repository name');
            if (!repoName) {
              problems.push('**Repository name** is missing.');
            } else if (!/^[0-9A-Za-z_-]+$/.test(repoName)) {
              problems.push(`**Repository name** \`${clean(repoName)}\` contains characters that are not allowed. Use only letters, numbers, \`_\` and \`-\`.`);
            }

            let url = field('Link to your modlists.json');
            if (!url) {
              problems.push('**Link to your modlists.json** is missing.');
            } else {
              const blob = url.match(/^https:\/\/(?:www\.)?github\.com\/([^/]+)\/([^/]+)\/blob\/(.+)$/);
              if (blob) url = `https://raw.githubusercontent.com/${blob[1]}/${blob[2]}/${blob[3]}`;
              url = url.replace(/^(https:\/\/raw\.githubusercontent\.com\/[^/]+\/[^/]+)\/refs\/(heads|tags)\//, '$1/');
              let parsed = null;
              try { parsed = new URL(url); } catch {}
              if (!parsed || parsed.protocol !== 'https:' || parsed.hostname !== 'raw.githubusercontent.com' || url.includes('"')) {
                problems.push(`**Link** \`${clean(url)}\` is not a GitHub file link. Open your \`modlists.json\` on github.com and copy the address of that page, or use its Raw URL.`);
                url = null;
              }
            }

            let modlists = null;
            if (url) {
              let resp = null;
              try { resp = await fetch(url); } catch (e) { problems.push(`Could not reach \`${clean(url)}\`: ${e.message}`); }
              if (resp && !resp.ok) {
                problems.push(`\`${clean(url)}\` returned HTTP ${resp.status}. Check that the repository is public and the file path is correct.`);
              } else if (resp) {
                const text = await resp.text();
                try { modlists = JSON.parse(text); }
                catch (e) { problems.push(`Your \`modlists.json\` is not valid JSON: ${e.message}`); }
              }
            }

            if (modlists !== null) {
              if (!Array.isArray(modlists) || modlists.length === 0) {
                problems.push('Your `modlists.json` must be a JSON **array** containing at least one modlist entry (wrap your entry in `[` and `]`).');
                modlists = null;
              }
            }

            if (modlists) {
              const titles = new Set(), machineUrls = new Set();
              modlists.forEach((m, i) => {
                const who = m && m.title ? `"${clean(String(m.title))}"` : `entry ${i + 1}`;
                if (!m || typeof m !== 'object') { problems.push(`Entry ${i + 1} is not an object.`); return; }
                for (const f of ['title', 'author', 'description']) {
                  if (!m[f] || !String(m[f]).trim()) problems.push(`${who}: \`${f}\` is missing or empty.`);
                }
                if (m.title && /(\d+\.)(\d+\.?)*/.test(m.title)) problems.push(`${who}: the title contains a version number. Put the version in the \`version\` field instead.`);
                if (!m.version || !/^\d+(\.\d+){1,3}$/.test(String(m.version))) problems.push(`${who}: \`version\` must look like \`1.0.0\`.`);
                if (!m.download_metadata) problems.push(`${who}: \`download_metadata\` is missing. Copy it from the \`.wabbajack.meta.json\` file next to your compiled list.`);
                const links = m.links || {};
                if (!links.machineURL || !/^[0-9A-Za-z_-]+$/.test(links.machineURL)) {
                  problems.push(`${who}: \`links.machineURL\` is missing or contains characters that are not allowed (letters, numbers, \`_\` and \`-\` only).`);
                } else if (machineUrls.has(links.machineURL.toLowerCase())) {
                  problems.push(`${who}: \`links.machineURL\` is not unique within your file.`);
                } else machineUrls.add(links.machineURL.toLowerCase());
                if (m.title) {
                  const t = String(m.title).toLowerCase();
                  if (titles.has(t)) problems.push(`${who}: the title is not unique within your file.`);
                  titles.add(t);
                }
                for (const f of ['download', 'readme', 'image']) {
                  let ok = false;
                  try { ok = Boolean(new URL(links[f])); } catch {}
                  if (!ok) problems.push(`${who}: \`links.${f}\` is missing or not a valid URL.`);
                }
                try {
                  const img = new URL(links.image);
                  if (/(^|\.)github\.com$/.test(img.hostname)) problems.push(`${who}: \`links.image\` points at a github.com page. Use the direct raw link to the image file.`);
                } catch {}
                if (!m.game || !String(m.game).trim()) {
                  problems.push(`${who}: \`game\` is missing.`);
                } else if (gameNames && !gameNames.has(String(m.game).toLowerCase())) {
                  problems.push(`${who}: \`game\` value \`${clean(String(m.game))}\` is not a game Wabbajack supports. Use the lowercase name of an entry in [Game.cs](https://github.com/wabbajack-tools/wabbajack/blob/main/Wabbajack.DTOs/Game/Game.cs), e.g. \`skyrimspecialedition\`.`);
                }
                if (!Array.isArray(m.maintainers) || m.maintainers.length === 0 || m.maintainers.some(x => !x || !String(x).trim())) {
                  problems.push(`${who}: \`maintainers\` must be a non-empty array like \`["github/${issue.user.login}"]\` - it controls who may publish updates to this list.`);
                } else {
                  if (m.maintainers.some(x => !/^github\//i.test(String(x)))) problems.push(`${who}: every \`maintainers\` entry must be prefixed with \`github/\`.`);
                  if (!m.maintainers.some(x => String(x).toLowerCase() === ('github/' + issue.user.login).toLowerCase())) warnings.push(`${who}: \`maintainers\` does not include \`github/${issue.user.login}\`, so you will not be able to publish updates from inside Wabbajack yourself.`);
                }
                if (m.tags !== undefined) {
                  if (!Array.isArray(m.tags) || m.tags.some(t => !t || !String(t).trim())) {
                    problems.push(`${who}: \`tags\` must be an array of non-empty strings.`);
                  } else if (allowedTags.size > 0) {
                    const unknown = m.tags.filter(t => !allowedTags.has(String(t).toLowerCase()));
                    if (unknown.length > 0) problems.push(`${who}: these tags are not on the [allowed list](https://github.com/wabbajack-tools/mod-lists/blob/master/allowed_tags.json) and will not show in the gallery: ${unknown.map(t => `\`${clean(String(t))}\``).join(', ')}.`);
                  }
                }
                const eq = (a, b) => String(a || '').trim().toLowerCase() === b.toLowerCase();
                const sampleHits = [];
                if (eq(m.title, 'Johns Skyrim Makeover')) sampleHits.push('`title`');
                if (eq(m.description, 'A complete visual makeover of Skyrim while sticking to the original system requirements!')) sampleHits.push('`description`');
                if (eq(m.author, 'JohnDoe')) sampleHits.push('`author`');
                if (Array.isArray(m.maintainers) && m.maintainers.some(x => eq(x, 'github/JohnDoe'))) sampleHits.push('`maintainers`');
                if (eq(links.machineURL, 'JohnsSkyrimMakeover')) sampleHits.push('`links.machineURL`');
                if (eq(links.image, 'https://raw.githubusercontent.com/Dylan-Perry/dp-modlists/main/wj_thumbnail-web.webp')) sampleHits.push('`links.image`');
                if (eq(links.readme, 'https://keizaal.github.io/Keizaal/')) sampleHits.push('`links.readme`');
                if (String(links.download || '').toLowerCase().includes('halgaris helper.wabbajack_29d245c9')) sampleHits.push('`links.download`');
                if (m.download_metadata && String(m.download_metadata.Hash || '') === 'e1+K7eJbDJw=') sampleHits.push('`download_metadata`');
                if (sampleHits.length > 0) problems.push(`${who}: these fields still contain the sample values from the wiki template: ${sampleHits.join(', ')}. Replace them with your own.`);
                if (eq(links.discordURL, 'https://discord.gg/wabbajack')) warnings.push(`${who}: \`links.discordURL\` is the official Wabbajack discord, which is also the wiki sample value - point it at your own support server unless this is intentional.`);
                if (m.download_metadata && !(Number(m.download_metadata.Size) > 0)) problems.push(`${who}: \`download_metadata.Size\` must be the size of your .wabbajack file. Copy the whole block from the \`.wabbajack.meta.json\` file next to your compiled list.`);
              });

              const checkedImages = new Set();
              for (const m of modlists) {
                const who = m && m.title ? `"${clean(String(m.title))}"` : 'your modlist';
                const imgUrl = m && m.links ? m.links.image : null;
                let valid = false;
                try { valid = Boolean(new URL(imgUrl)); } catch {}
                if (!valid || checkedImages.has(imgUrl)) continue;
                checkedImages.add(imgUrl);
                const img = await fetchImage(imgUrl);
                if (img.err) { problems.push(`${who}: the image link could not be fetched (${img.err}).`); continue; }
                if (img.tooLarge || img.size > 1048576) {
                  problems.push(`${who}: the image is ${(img.size / 1048576).toFixed(2)} MB${img.tooLarge ? ' or more' : ''} - it must be at or below 1 MB.`);
                  if (img.tooLarge) continue;
                }
                const dims = img.buf ? imageDims(img.buf) : null;
                if (!dims) { problems.push(`${who}: the image is not a WebP, PNG or JPG file (WebP preferred).`); continue; }
                if (dims.w > 0 && dims.h > 0) {
                  const target = 16 / 9;
                  if (Math.abs(dims.w / dims.h - target) / target > 0.02) {
                    problems.push(`${who}: the image is ${dims.w}x${dims.h}, which is not 16:9. Use for example 1600x900 or 1920x1080.`);
                  }
                } else {
                  warnings.push(`${who}: could not read the image dimensions to verify it is 16:9.`);
                }
              }
            }

            const repositories = JSON.parse(fs.readFileSync('repositories.json', 'utf8'));
            const invalid = JSON.parse(fs.readFileSync('invalid_repositories.json', 'utf8'));
            if (repoName) {
              const lower = repoName.toLowerCase();
              for (const [k, v] of Object.entries(repositories)) {
                if (k.toLowerCase() === lower) problems.push(`The repository name \`${clean(repoName)}\` is already taken. Pick another name.`);
                if (url && v.toLowerCase() === url.toLowerCase()) problems.push(`That \`modlists.json\` URL is already in the gallery under the name \`${k}\`.`);
              }
              for (const [k, v] of Object.entries(invalid)) {
                if (k.toLowerCase() === lower || (url && v.toLowerCase() === url.toLowerCase())) {
                  problems.push(`The name or URL matches an entry in \`invalid_repositories.json\` (\`${k}\`). A maintainer needs to resolve this - please mention it below.`);
                }
              }
            }

            if (problems.length > 0) {
              await report([
                `### Some checks did not pass yet`,
                ``,
                ...problems.map(p => `- ${p}`),
                ...(warnings.length ? [``, `Also worth noting:`, ...warnings.map(w => `- ${w}`)] : []),
                ``,
                `Fix the points above in your \`modlists.json\`, then **comment \`fixed\` on this issue** and the checks run again. If the repository name or link itself needs changing, edit the issue description instead.`,
                `The [wiki guide](https://wiki.wabbajack.org/wabbajack_cdn_and_gallery_access/Adding%20a%20Custom%20Repository%20to%20Wabbajack.html) explains every field.`,
              ].join('\n'));
              return;
            }

            const branch = `submission/issue-${issue.number}`;
            const base = context.payload.repository.default_branch;
            const baseRef = await github.rest.git.getRef({ ...context.repo, ref: `heads/${base}` });
            try {
              await github.rest.git.createRef({ ...context.repo, ref: `refs/heads/${branch}`, sha: baseRef.data.object.sha });
            } catch {
              await github.rest.git.updateRef({ ...context.repo, ref: `heads/${branch}`, sha: baseRef.data.object.sha, force: true });
            }

            const fileResp = await github.rest.repos.getContent({ ...context.repo, path: 'repositories.json', ref: branch });
            const current = Buffer.from(fileResp.data.content, 'base64').toString('utf8');
            const eol = current.includes('\r\n') ? '\r\n' : '\n';
            const updated = current.replace(/\s*}\s*$/, '') + `,${eol}  ${JSON.stringify(repoName)}: ${JSON.stringify(url)}${eol}}`;
            await github.rest.repos.createOrUpdateFileContents({
              ...context.repo,
              path: 'repositories.json',
              message: `Add repository ${repoName} (#${issue.number})`,
              content: Buffer.from(updated, 'utf8').toString('base64'),
              sha: fileResp.data.sha,
              branch,
            });

            const existing = await github.rest.pulls.list({ ...context.repo, state: 'open', head: `${context.repo.owner}:${branch}` });
            let pr;
            if (existing.data.length > 0) {
              pr = existing.data[0];
            } else {
              const created = await github.rest.pulls.create({
                ...context.repo,
                base,
                head: branch,
                title: `Add repository: ${repoName}`,
                body: [
                  `Automated submission from #${issue.number} by @${issue.user.login}.`,
                  ``,
                  `| | |`,
                  `|---|---|`,
                  `| Repository name | \`${repoName}\` |`,
                  `| modlists.json | ${url} |`,
                  `| Modlists in file | ${modlists.length} |`,
                  ``,
                  `Basic checks (JSON validity, required fields, duplicate names/URLs) passed in the issue.`,
                  process.env.USING_APP_TOKEN === 'true'
                    ? `The Validation workflow runs on this PR automatically.`
                    : `**Maintainers:** re-run the Validation workflow on this PR before merging - it was opened with the fallback Actions token, which does not trigger workflows. Configure the \`SUBMISSION_APP_ID\` / \`SUBMISSION_APP_PRIVATE_KEY\` secrets to fix this permanently.`,
                  ``,
                  `Closes #${issue.number}`,
                ].join('\n'),
              });
              pr = created.data;
            }

            const publishIds = modlists
              .filter(m => m.links && m.links.machineURL)
              .map(m => `\`${repoName}/${m.links.machineURL}\``).join(', ');
            await report([
              `### All checks passed`,
              ``,
              `Your \`modlists.json\` looks good (${modlists.length} modlist${modlists.length === 1 ? '' : 's'} found).`,
              `A pull request has been opened for you: ${pr.html_url}`,
              ...(warnings.length ? [``, `Worth noting:`, ...warnings.map(w => `- ${w}`)] : []),
              ``,
              `A maintainer will review it. Once it is merged, your modlist appears in the Wabbajack gallery and this issue closes automatically.`,
              `To publish updates from inside Wabbajack afterwards, set the compiler's Machine URL to ${publishIds}.`,
              `If you change your \`modlists.json\` before the review, no action is needed here - the gallery always reads the live file from your repository.`,
            ].join('\n'));
